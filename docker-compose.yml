services:

  ###################################
  # Laravel Migration (one-shot)
  ###################################

  migrate:
    build:
      context: ./pulse-backend
      dockerfile: Dockerfile
    command: php artisan migrate --force
    env_file:
      - .env
    networks:
      - infrastructure
    restart: "no"

  ###################################
  # Laravel PHP-FPM (internal :9000)
  ###################################

  backend:
    build:
      context: ./pulse-backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    expose:
      - "9000"
    command: php-fpm
    restart: unless-stopped
    networks:
      - infrastructure

  ###################################
  # Nginx → FastCGI to backend:9000
  # Public HTTP on :8000 (NOT 8080 — Dozzle)
  ###################################

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    networks:
      - infrastructure

  ###################################
  # Queue worker
  ###################################

  queue:
    build:
      context: ./pulse-backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    command: >
      php artisan queue:work
      --queue=notifications
      --sleep=1
      --tries=3
      --timeout=90
      --max-time=3600
    restart: unless-stopped
    networks:
      - infrastructure

  ###################################
  # Scheduler
  ###################################

  scheduler:
    build:
      context: ./pulse-backend
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    command: php artisan schedule:work
    restart: unless-stopped
    networks:
      - infrastructure

  ###################################
  # Next.js dashboard
  ###################################

  frontend:
    build:
      context: ./pulse-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    env_file:
      - .env
    ports:
      - "127.0.0.1:7000:7000"
    restart: unless-stopped
    networks:
      - infrastructure

networks:

  infrastructure:
    external: true
    name: infrastructure
